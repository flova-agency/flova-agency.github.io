# Déploie automatiquement les fonctions Supabase à chaque modification poussée sur main.
# Nécessite le secret SUPABASE_ACCESS_TOKEN (Settings > Secrets and variables > Actions).
name: Déployer les fonctions Supabase
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", ".github/workflows/deploy-functions.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'flova-agency/flova-agency.github.io' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: 2.122.1 }
      - name: Vérifier le secret
        run: test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Secret SUPABASE_ACCESS_TOKEN manquant"; exit 1; }
      - name: Déployer
        run: |
          for f in supabase/functions/*/; do
            n=$(basename "$f")
            extra=""; case "$n" in flova-domaine|ineed-atelier) extra="--no-verify-jwt";; esac
            supabase functions deploy "$n" --project-ref nhukbglercraslszazan --use-api --yes $extra
          done
  # Porte de bout en bout (palier 1, 24/11) : une version cassée ne reste jamais en ligne.
  porte:
    needs: deploy
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'flova-agency/flova-agency.github.io' }}
    permissions: { contents: write }
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && python -m playwright install --with-deps webkit
      - name: Porte (iPhone 15, production)
        id: porte
        run: |
          set +e
          python tests/porte.py; c=$?
          if [ $c -ne 0 ]; then sleep 20; python tests/porte.py; c=$?; fi
          echo "code=$c" >> "$GITHUB_OUTPUT"
          if [ $c -eq 3 ]; then echo "::warning::Moteur saturé : version non jugée, pas de retour arrière"; fi
          exit 0
      - name: Verte, marquer cette version comme sûre
        if: steps.porte.outputs.code == '0'
        run: git tag -f porte-verte && git push -f origin porte-verte
      - uses: supabase/setup-cli@v1
        if: steps.porte.outputs.code == '1'
        with: { version: 2.122.1 }
      - name: Rouge, remettre la dernière version verte
        if: steps.porte.outputs.code == '1'
        run: |
          git checkout porte-verte -- supabase/functions
          for f in supabase/functions/*/; do
            n=$(basename "$f"); extra=""; case "$n" in flova-domaine|ineed-atelier) extra="--no-verify-jwt";; esac
            supabase functions deploy "$n" --project-ref nhukbglercraslszazan --use-api --yes $extra
          done
          echo "Version cassée retirée, porte-verte remise en ligne"; exit 1
