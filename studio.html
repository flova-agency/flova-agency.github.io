<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#06070b">
<title>Mon site Flova — assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,800;125,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#06070b;--ink:#f3f4f8;--mute:#9aa0b4;--blue:#2f5bff;--wa:#008069;--wabg:#efeae2;--out:#d9fdd3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.top{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #161a26}
.logo{font:900 17px Archivo;font-stretch:125%;letter-spacing:.06em;display:flex;align-items:center;gap:9px;white-space:nowrap}
.logo i{width:11px;height:11px;background:var(--blue);transform:rotate(45deg);border-radius:2px}
.top small{color:var(--mute);font-size:12.5px}
.app{height:calc(100% - 54px);display:grid;grid-template-columns:400px 1fr;gap:22px;padding:22px}
/* conversation façon messagerie */
.chat{display:flex;flex-direction:column;background:var(--wabg);border-radius:28px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55);border:8px solid #11131c;min-height:0}
.ch{background:var(--wa);color:#fff;display:flex;align-items:center;gap:11px;padding:12px 14px}
.av{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.av i{width:13px;height:13px;background:var(--blue);transform:rotate(45deg);border-radius:2px}
.ch b{display:block;font-size:16px;font-weight:600}
.ch span{font-size:12.5px;opacity:.85}
.pv{display:none}
.tg{display:none;place-items:center;flex:none;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:15px;cursor:pointer}
.msgs{flex:1;overflow-y:auto;padding:14px 12px 6px;display:flex;flex-direction:column;gap:6px;background-color:var(--wabg);background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:18px 18px;overscroll-behavior:contain}
.b{max-width:84%;padding:7px 10px 18px;border-radius:9px;color:#111b21;position:relative;font-size:15px;box-shadow:0 1px .5px rgba(11,20,26,.13);white-space:pre-wrap;word-wrap:break-word;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.b.in{background:#fff;align-self:flex-start;border-top-left-radius:2px}
.b.out{background:var(--out);align-self:flex-end;border-top-right-radius:2px}
.b .t{position:absolute;right:8px;bottom:3px;font-size:11px;color:#667781}
.b.out .t::after{content:" ✓✓";color:#53bdeb}
.b a{color:#027eb5;font-weight:600;text-decoration:none;cursor:pointer}
.b .ok{color:#008069;font-weight:600}
.qr{display:flex;flex-wrap:wrap;gap:6px;align-self:flex-start;max-width:92%;margin:-2px 0 4px}
.dom{display:grid;gap:8px;margin-top:10px}.dom div{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#f6f8f7;border-radius:10px;padding:8px 10px;font-weight:600}.dom div span:first-child{display:flex;flex-wrap:nowrap;gap:6px;align-items:center;min-width:0;font-size:14.5px}.dom div span:first-child b{min-width:0;overflow-wrap:anywhere;font-weight:600}.dom div.pris{opacity:.55;font-weight:500}.dform{display:grid;gap:7px;margin-top:10px}.dform input,.dform select{font:15px Inter;border:1px solid #d1d7db;border-radius:9px;padding:9px 10px;width:100%;background:#fff;color:#111b21}.dform .row{display:grid;grid-template-columns:1fr 1fr;gap:7px}.dform button{font:600 15px Inter;background:var(--wa);color:#fff;border:0;border-radius:999px;padding:11px 14px;cursor:pointer;margin-top:4px}
.dom button{font:600 13.5px Inter;background:var(--wa);color:#fff;border:0;border-radius:999px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.qr button{font:500 13.5px Inter;background:#fff;color:#008069;border:1px solid #c7e8df;border-radius:999px;padding:7px 12px;cursor:pointer;text-align:left}
.b .ux{display:inline-block;margin-top:8px;font:600 14px Inter;background:var(--wa);color:#fff;border:0;border-radius:999px;padding:9px 16px;cursor:pointer}.b .ux:disabled{opacity:.6}
.b .gg{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;width:100%;font:600 15px Inter;background:#fff;color:#1f1f1f;border:1px solid #dadce0;border-radius:999px;padding:11px 16px;cursor:pointer}
.b .alt{display:block;margin-top:10px;font-size:13.5px}
.typing{align-self:flex-start;background:#fff;border-radius:9px;padding:10px 14px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:#8696a0;animation:bl 1.2s infinite}
.typing span{font-size:13px;color:#667781;margin-left:6px;align-self:center}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.chips{display:flex;gap:7px;overflow-x:auto;padding:8px 10px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;font:500 13px Inter;background:#fff;color:#111b21;border:1px solid #d1d7db;border-radius:999px;padding:7px 12px;cursor:pointer}
.comp{display:flex;align-items:flex-end;gap:7px;padding:8px 8px 10px}
.comp textarea{flex:1;resize:none;border:0;border-radius:22px;padding:11px 16px;font:16px/1.35 Inter;max-height:120px;outline:0;background:#fff;color:#111b21}
.go{width:46px;height:46px;border-radius:50%;border:0;background:var(--wa);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.go svg{width:22px;height:22px}
.att{width:46px;height:46px;border-radius:50%;border:0;background:transparent;color:#54656f;display:grid;place-items:center;cursor:pointer;flex:none}
.att svg{width:24px;height:24px}
.b img{display:block;max-width:220px;width:100%;border-radius:6px;margin:-3px -6px 4px}
.go.rec{background:#e5484d;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,72,77,.5)}100%{box-shadow:0 0 0 14px rgba(229,72,77,0)}}
/* aperçu du site */
.site{display:flex;flex-direction:column;border-radius:18px;overflow:hidden;border:1px solid #1d2233;background:#0b0d14;min-height:0;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#11131c;border-bottom:1px solid #1d2233}
.dots{display:flex;gap:6px}.dots i{width:11px;height:11px;border-radius:50%;background:#2a2f45}
.url{flex:1;background:#06070b;border-radius:8px;padding:6px 12px;font-size:13px;color:var(--mute);display:flex;align-items:center;gap:8px}
.live{font-size:12px;font-weight:600;color:#7ee2a8;display:flex;align-items:center;gap:6px;white-space:nowrap}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:#7ee2a8;box-shadow:0 0 0 3px rgba(126,226,168,.2)}
iframe{flex:1;width:100%;border:0;background:#06070b}
/* écran d'accueil */
.intro{position:fixed;inset:0;z-index:50;grid-template-columns:minmax(0,1fr);justify-items:center;overflow-y:auto;background:radial-gradient(90% 70% at 20% 0%,rgba(47,91,255,.35),transparent),var(--bg);display:grid;place-items:center;padding:24px;transition:opacity .45s}
.intro.off{opacity:0;pointer-events:none}
.card{width:100%;max-width:520px;min-width:0}
.card h1{font:900 clamp(32px,7.5vw,56px)/1 Archivo;font-stretch:125%;letter-spacing:-.025em;margin:0 0 16px}
.card h1 em{font-style:normal;color:var(--blue)}
.card p{color:var(--mute);font-size:16.5px;margin:0 0 24px}
.field{display:flex;align-items:center;gap:10px;min-width:0;background:#11131c;border:1.5px solid #262b40;border-radius:16px;padding:6px 6px 6px 16px}
.field input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:16px Inter}
.field button,.cta{font:700 15px Inter;background:var(--blue);color:#fff;border:0;border-radius:12px;padding:13px 18px;cursor:pointer;white-space:nowrap}
.steps{list-style:none;margin:22px 0 0;padding:0;display:grid;gap:10px}
.steps li{display:flex;align-items:center;gap:12px;color:var(--mute);opacity:.35;transition:opacity .3s,color .3s}
.steps li.on{opacity:1;color:var(--ink)}
.steps li i{width:22px;height:22px;border-radius:50%;border:2px solid #2a2f45;display:grid;place-items:center;font-size:12px;font-style:normal;flex:none}
.steps li.done i{background:var(--blue);border-color:var(--blue);color:#fff}
.note{font-size:12.5px;color:#5d6378;margin-top:26px}
.skip{background:none;border:0;color:var(--mute);font:500 14px Inter;margin-top:14px;cursor:pointer;padding:6px 0}
@media(max-width:860px){
  .top{display:none}
  .app{height:100%;grid-template-columns:1fr;grid-template-rows:44% 56%;gap:0;padding:0}
  .site{border-radius:0;border:0;box-shadow:none;order:1}
  .bar{padding:7px 10px}.dots{display:none}
  .app{display:block}
  .site{position:fixed;left:0;right:0;top:0;bottom:var(--mini,190px)}
  .bar{display:none}
  .chat{position:fixed;left:0;right:0;bottom:0;z-index:5;border-radius:18px 18px 0 0;border:0;box-shadow:0 -10px 30px rgba(0,0,0,.45)}
  .chat .msgs{display:none}
  .chat.open .msgs{display:flex;height:min(52vh,460px);flex:none}
  .ch{padding:8px 12px;cursor:pointer;border-radius:18px 18px 0 0}.av{width:32px;height:32px}
  .ch .hd{flex:1;min-width:0}
  .ch b{font-size:15px;display:inline}.ch #st{margin-left:6px}
  .pv{display:block;font-size:13.5px!important;opacity:1!important;line-height:1.3;margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .chat.open .pv{display:none}
  .tg{display:grid}
  .comp{padding-bottom:max(10px,env(safe-area-inset-bottom))}
}
.aud{display:flex;gap:12px;align-items:center;margin:6px 0 8px}
.aud .ring{--v:0;flex:none;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--c,#25d366) calc(var(--v)*1%),#e9edef 0);display:grid;place-items:center;transition:--v 1s}
.aud .ring b{width:50px;height:50px;border-radius:50%;background:#fff;display:grid;place-items:center;font:700 19px Inter;color:#111b21}
.crit{margin:6px 0 2px;display:grid;gap:7px}
.crit div{font-size:12.5px;line-height:1.3}
.crit .gauge{height:6px;border-radius:9px;background:#e9edef;overflow:hidden;margin:3px 0 1px}
.crit .gauge i{display:block;height:100%;border-radius:9px;width:0;transition:width .9s ease}
.crit small{color:#667781;display:block}
.aud .lb{font-size:13px;color:#667781}
.aud b.t{font-size:16px}
.vers{margin-top:6px;display:grid;gap:6px}
.vers div{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#f5f6f6;border-radius:8px;padding:7px 9px;font-size:13px}
.vers small{display:block;color:#667781;font-size:11.5px}
.vers button{font:600 12.5px Inter;background:#fff;color:#008069;border:1px solid #d1d7db;border-radius:999px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.vers .on{background:#d9fdd3}
.serp{border:1px solid #e3e6e8;border-radius:10px;padding:9px 11px;margin:6px 0;background:#fff;font-family:Arial,sans-serif}
.serp .u{font-size:12px;color:#202124;display:flex;align-items:center;gap:6px}
.serp .u i{width:18px;height:18px;border-radius:50%;background:#0b0d14;display:inline-grid;place-items:center;color:#fff;font:700 9px Arial;font-style:normal}
.serp .h{color:#1a0dab;font-size:16px;line-height:1.3;margin:3px 0 2px}
.serp .d{color:#4d5156;font-size:13px;line-height:1.4}
.qrw{display:flex;gap:10px;align-items:center;margin:8px 0 4px}
.qrw span{font-size:13.5px;line-height:1.35}
.qrw canvas{width:116px;height:116px;border-radius:8px;border:1px solid #e3e6e8;flex:none;background:#fff}
.shb{display:flex;flex-wrap:wrap;gap:6px}
.shb a,.shb button{font:600 13px Inter;border:1px solid #d1d7db;background:#fff;color:#111b21;border-radius:999px;padding:7px 11px;cursor:pointer;text-decoration:none}
.shb .wa{background:#25d366;color:#fff;border-color:#25d366}
.sty{display:grid;gap:7px;margin-top:7px}
.sty button.c{display:flex;gap:10px;align-items:center;text-align:left;width:100%;background:#fff;border:2px solid #e3e6e8;border-radius:12px;padding:8px 10px;cursor:pointer;font:inherit;color:#111b21}
.sty button.c.on{border-color:#25d366;box-shadow:0 0 0 3px rgba(37,211,102,.18)}
.sty .sw{flex:none;width:46px;height:46px;border-radius:10px;position:relative;overflow:hidden;border:1px solid rgba(0,0,0,.08)}
.sty .sw i{position:absolute;inset:auto 6px 6px auto;width:16px;height:16px;border-radius:50%}
.sty .sw u{position:absolute;left:6px;top:7px;width:20px;height:4px;border-radius:3px;text-decoration:none}
.sty .sw s{position:absolute;left:6px;top:15px;width:14px;height:3px;border-radius:3px;opacity:.6}
.sty b{display:block;font-size:14px}.sty small{display:block;color:#667781;font-size:12.5px;line-height:1.3}
.styk{display:flex;gap:6px;margin-top:8px}
.styk button{flex:1;font:600 13.5px Inter;border-radius:10px;padding:9px;cursor:pointer;border:1px solid #d1d7db;background:#fff;color:#111b21}
.styk .k{background:#25d366;border-color:#25d366;color:#fff}.styk button:disabled{opacity:.5}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:7px 0}
.kpi div{background:#f5f6f6;border-radius:9px;padding:7px 8px;text-align:center}
.kpi b{display:block;font:700 20px Inter;color:#111b21}.kpi small{font-size:11.5px;color:#667781}
.spark{display:flex;align-items:flex-end;gap:3px;height:54px;margin:6px 0 2px}
.spark i{flex:1;background:#25d366;border-radius:3px 3px 0 0;min-height:2px;opacity:.85;transform-origin:bottom;animation:grow .7s ease-out both}
@keyframes grow{from{transform:scaleY(0)}}
.spk{display:flex;justify-content:space-between;font-size:11px;color:#667781;margin-bottom:6px}
.rows{display:grid;gap:5px;margin-top:6px;font-size:12.5px}
.rows div{display:grid;grid-template-columns:96px 1fr 34px;align-items:center;gap:6px}
.rows .gauge{height:7px;border-radius:9px;background:#e9edef;overflow:hidden}.rows .gauge i{display:block;height:100%;background:#53bdeb;border-radius:9px}
.rows span:last-child{text-align:right;color:#667781}
.msg{background:#f5f6f6;border-radius:10px;padding:8px 10px;margin-top:7px;font-size:13.5px}
.msg.nv{background:#e7f8ee;border-left:3px solid #25d366}
.msg .who{display:flex;justify-content:space-between;gap:8px}.msg .who small{color:#667781;font-size:11.5px;white-space:nowrap}
.msg p{margin:4px 0 6px;white-space:pre-wrap;color:#3b4a54;max-height:7.2em;overflow:hidden}
.msg .act{display:flex;gap:6px;flex-wrap:wrap}.msg .act a{font:600 12.5px Inter;text-decoration:none;color:#008069;background:#fff;border:1px solid #d1d7db;border-radius:999px;padding:5px 10px}
#chips [data-msgs] em{font-style:normal;background:#25d366;color:#fff;border-radius:999px;padding:0 6px;margin-left:5px;font-size:12px}
.fixall{display:block;width:100%;margin-top:9px;font:600 14px Inter;background:#25d366;color:#fff;border:0;border-radius:10px;padding:10px;cursor:pointer}
</style>
</head>
<body>
<div class="top"><div class="logo"><i></i>FLOVA</div><small>Ton site qui obéit · build by Uxlab.ai</small></div>

<main class="app">
  <section class="chat" aria-label="Conversation avec ton site">
    <div class="ch" id="ch"><div class="av"><i></i></div><div class="hd"><b>Mon site Flova</b><span id="st">en ligne</span><span class="pv" id="pv"></span></div><button class="tg" id="tg" type="button" aria-label="Afficher la conversation">▴</button></div>

      <button type="button" data-vers>🕓 Mes versions</button>
      <button type="button" data-share>📲 Partager mon site</button>
      <button type="button">🌐 Trouve mon nom de domaine</button>
      <button type="button">💡 Donne-moi 3 idées pour mon site</button>
      <button type="button">🎨 Propose-moi 3 styles pour mon site</button>
      <button type="button">✨ Rends le site plus luxe</button>
      <button type="button">❓ Ajoute une FAQ</button>
      <button type="button">📣 Ajoute un bandeau promo</button>
      <button type="button">🌍 Ajoute la version anglaise du site</button>
      <button type="button">🌍 Ajoute le néerlandais</button>
      <button type="button">Masque la section Offres</button>
      <button type="button">Mets le Contact juste après les Travaux</button>
      <button type="button">Rends le grand titre plus percutant</button>
    </div>
    <form class="comp" id="comp" action="#">
      <button class="att" id="att" type="button" aria-label="Envoyer une photo"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 3 7.17 5H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.17L15 3H9Zm3 15a5 5 0 1 1 0-10 5 5 0 0 1 0 10Zm0-2a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/></svg></button>

  </section>

  <section class="site" aria-label="Ton site, en direct">
    <div class="bar"><div class="dots"><i></i><i></i><i></i></div><div class="url">🔒 flovaagency.com</div><div class="live">en direct</div></div>
    <iframe id="ifr" src="/?apercu=1&studio=1" title="Aperçu du site"></iframe>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  let rec = null;
  const sb = window.supabase.createClient('https://nhukbglercraslszazan.supabase.co', 'sb_publishable_Oroyu2rpfCBnjnPxrf6GBQ_dTgkisoB', { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'flova-auth' } });
  const MIC = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12h-2Z"/></svg>';
  const SEND = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg>';
  let cur = null, hist = [], busy = false, ready = false, pending = null, editor = false, login = null;
  const ifr = $('ifr'), msgs = $('msgs'), txt = $('txt'), go = $('go');
  const now = () => new Date().toLocaleTimeString('fr-BE', { hour: '2-digit', minute: '2-digit' });
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function bubble(html, side) {
    const d = document.createElement('div'); d.className = 'b ' + side; d.innerHTML = html + `<span class="t">${now()}</span>`;
    msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight;
    if (side === 'in') { const c = d.cloneNode(true); c.querySelector('.t').remove(); c.querySelectorAll('a,button').forEach(a => a.remove()); $('pv').textContent = c.textContent.replace(/\s+/g, ' ').trim(); }
    return d;
  }
  const chat = document.querySelector('.chat'), mob = matchMedia('(max-width:860px)');
  function sheet(open) {
    chat.classList.toggle('open', open); $('tg').textContent = open ? '▾' : '▴';
    $('tg').setAttribute('aria-label', open ? 'Replier la conversation' : 'Afficher la conversation');
    if (open) msgs.scrollTop = msgs.scrollHeight; else fit();
  }
  function fit() { if (mob.matches && !chat.classList.contains('open')) document.documentElement.style.setProperty('--mini', chat.offsetHeight + 'px'); }
  new ResizeObserver(fit).observe(chat);
  $('ch').addEventListener('click', () => sheet(!chat.classList.contains('open')));
  let stT = null;
  const STEPS = ['je lis ton site…', 'je prépare la modification…', 'j’écris les textes…', 'je vérifie chaque détail…', 'presque fini…'];

    const b = bubble('🕓 Tes dernières versions. Touche « Revenir » pour remettre le site comme à ce moment-là (tu pourras toujours annuler) :<div class="vers"><div class="on"><span><b>Maintenant</b><small>version en ligne</small></span></div>' + data.map(r => `<div><span><b>${esc(quand(r.at))}</b><small>${r.by ? 'par ' + esc(String(r.by).split('@')[0]) : 'version d’origine'}</small></span><button type="button" data-v="${r.id}">Revenir</button></div>`).join('') + '</div>', 'in');
    b.querySelectorAll('[data-v]').forEach(btn => btn.addEventListener('click', async () => {
      if (busy) return; busy = true; btn.textContent = '…';
      const avant = cur;
      const { error: e2 } = await sb.rpc('flova_restore', { p_id: +btn.dataset.v });
      if (e2) { busy = false; btn.textContent = 'Revenir'; return bubble('Le retour n’a pas marché. Rien n’a bougé sur ton site.', 'in'); }
      ready = false; const w = new Promise(r => { const t = setInterval(() => { if (ready) { clearInterval(t); r(); } }, 150); setTimeout(() => { clearInterval(t); r(); }, 8000); });
      ifr.src = '/?apercu=1&studio=1&v=' + Date.now(); await w;
      if (avant) hist.push(avant);
      busy = false; b.querySelectorAll('[data-v]').forEach(x => x.disabled = true); btn.textContent = '✓';
      const k = bubble(`<span class="ok">✓ Ton site est revenu comme il était ${esc(quand(data.find(r => r.id == btn.dataset.v).at).replace(/^./, c => c.toLowerCase()))}, en ligne.</span>\n<a data-undo>↶ Annuler</a>`, 'in');
      k.querySelector('[data-undo]').addEventListener('click', undo); sheet(false);
    }));
  }
  /* messages reçus par le formulaire du site */
  async function badgeMsgs() {
    try { const { count } = await sb.from('flova_messages').select('id', { count: 'exact', head: true }).eq('lu', false).eq('test', false); const c = document.querySelector('#chips [data-msgs]'); if (c) c.innerHTML = '✉️ Messages' + (count ? `<em>${count}</em>` : ''); if (count) { const ch = c; ch.parentNode.prepend(ch); } } catch (x) {}
  }
  async function messages() {
    sheet(true);
    const { data, error } = await sb.from('flova_messages').select('id,at,nom,entreprise,email,tel,message,lu').eq('test', false).order('at', { ascending: false }).limit(20);
    if (error) return bubble('Je n’arrive pas à lire tes messages pour le moment. Réessaie dans un instant.', 'in');
    if (!data || !data.length) return bubble('✉️ Pas encore de message. Quand un visiteur remplit le formulaire de ton site, son message arrive ici et dans ta boîte mail.', 'in');
    const nv = data.filter(m => !m.lu).length;
    bubble(`✉️ <b>${nv ? nv + ' nouveau' + (nv > 1 ? 'x' : '') + ' message' + (nv > 1 ? 's' : '') : 'Tes derniers messages'}</b>` + data.map(m => { const t = (m.tel || '').replace(/[^\d+]/g, ''), wa = t.replace(/^\+/, '').replace(/^0/, '32'); return `<div class="msg${m.lu ? '' : ' nv'}"><div class="who"><b>${esc(m.nom)}${m.entreprise ? ' · ' + esc(m.entreprise) : ''}</b><small>${esc(quand(m.at))}</small></div><p>${esc(m.message || '')}</p><div class="act"><a href="mailto:${esc(m.email)}?subject=${encodeURIComponent('Votre demande')}">Répondre par mail</a>${t ? `<a href="tel:${esc(t)}">Appeler</a><a target="_blank" rel="noopener" href="https://wa.me/${esc(wa)}">WhatsApp</a>` : ''}</div></div>`; }).join(''), 'in');
    const ids = data.filter(m => !m.lu).map(m => m.id);
    if (ids.length) { await sb.from('flova_messages').update({ lu: true }).in('id', ids); badgeMsgs(); }
  }
  /* visites : compteurs anonymes du site */
  const NOMS = { hero: 'Accueil', clients: 'Clients', manifeste: 'Manifeste', expertises: 'Expertises', formats: 'Formats', travaux: 'Travaux', secteurs: 'Secteurs', methode: 'Méthode', fondateur: 'Fondateur', offres: 'Offres', contact: 'Contact' };
  const SRC = { direct: 'Accès direct', google: 'Google', instagram: 'Instagram', tiktok: 'TikTok', facebook: 'Facebook', whatsapp: 'WhatsApp', moteur: 'Autres moteurs', autre: 'Autres sites' };
  const LNG = { fr: 'Français', en: 'Anglais', nl: 'Néerlandais', de: 'Allemand', es: 'Espagnol', it: 'Italien', tr: 'Turc', ar: 'Arabe', pt: 'Portugais' };
  async function visites() {
    sheet(true);
    const d0 = new Date(Date.now() - 29 * 864e5).toISOString().slice(0, 10);
    const { data, error } = await sb.from('flova_visits').select('day,k,n').gte('day', d0).limit(5000);
    if (error) return bubble('Je n’arrive pas à lire tes visites pour le moment. Réessaie dans un instant.', 'in');
    const by = {}, tot = {}; (data || []).forEach(r => { (by[r.day] = by[r.day] || {})[r.k] = r.n; tot[r.k] = (tot[r.k] || 0) + r.n; });
    const day = i => new Date(Date.now() - i * 864e5).toISOString().slice(0, 10);
    const v = i => (by[day(i)] || {}).v || 0;
    const auj = v(0), sem = [0, 1, 2, 3, 4, 5, 6].reduce((a, i) => a + v(i), 0), mois = tot.v || 0;
    if (!mois) return bubble('📈 Pas encore de visite comptée. Dès qu’un visiteur ouvre ton site, ses visites apparaissent ici (sans cookie ni donnée personnelle). Partage ton site pour lancer le compteur !', 'in');
    const j14 = [...Array(14)].map((_, k) => v(13 - k)), mx = Math.max(1, ...j14);
    const tel = Math.round(100 * (tot.tel || 0) / Math.max(1, (tot.tel || 0) + (tot.ord || 0)));
    const rows = (pre, map, lim) => { const L = Object.keys(tot).filter(k => k.startsWith(pre)).map(k => [k.slice(pre.length), tot[k]]).sort((a, b) => b[1] - a[1]).slice(0, lim); const m = Math.max(1, ...L.map(x => x[1])); return L.map(([k, n]) => `<div><span>${esc(map[k] || k.replace(/^x_/, 'Section '))}</span><span class="gauge"><i style="width:${Math.round(100 * n / m)}%"></i></span><span>${n}</span></div>`).join(''); };
    const secs = rows('s_', NOMS, 5), srcs = rows('src_', SRC, 4), lgs = rows('l_', LNG, 3);
    bubble(`📈 <b>Tes visites</b> (30 derniers jours, sans cookie)<div class="kpi"><div><b>${auj}</b><small>aujourd’hui</small></div><div><b>${sem}</b><small>7 jours</small></div><div><b>${tel}%</b><small>sur téléphone</small></div></div><div class="spark">${j14.map((n, k) => `<i title="${n}" style="height:${Math.max(3, Math.round(100 * n / mx))}%;animation-delay:${k * 30}ms"></i>`).join('')}</div><div class="spk"><span>il y a 14 jours</span><span>aujourd’hui</span></div>${secs ? '<b>Sections les plus vues</b><div class="rows">' + secs + '</div>' : ''}${srcs ? '<br><b>D’où viennent tes visiteurs</b><div class="rows">' + srcs + '</div>' : ''}${lgs ? '<br><b>Langues</b><div class="rows">' + lgs + '</div>' : ''}`, 'in');
    const q2 = document.createElement('div'); q2.className = 'qr';
    const top = Object.keys(tot).filter(k => k.startsWith('s_') && k !== 's_hero').sort((a, b) => tot[b] - tot[a])[0];
    ['Donne-moi 3 idées pour avoir plus de visiteurs', ...(top && NOMS[top.slice(2)] ? ['Mets la section ' + NOMS[top.slice(2)] + ' juste après l’accueil'] : [])].forEach(t => { const x = document.createElement('button'); x.type = 'button'; x.textContent = t; x.onclick = () => { q2.remove(); ask(t); }; q2.appendChild(x); });
    msgs.appendChild(q2); msgs.scrollTop = msgs.scrollHeight;
  }
  /* partage : aperçu Google, QR code, WhatsApp */
  function loadQR() { return window.qrcode ? Promise.resolve() : new Promise((ok, ko) => { const x = document.createElement('script'); x.src = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js'; x.onload = ok; x.onerror = ko; document.head.appendChild(x); }); }
  async function partager() {
    sheet(true);
    const url = location.origin + '/', host = location.host.replace(/^www\./, '');
    const L = (cur && cur.links) || {}, titre = L.seoTitle || document.title, desc = L.seoDesc || '';
    const b = bubble(`📲 Voici ton site tel qu’il apparaît sur Google, et de quoi le partager :<div class="serp"><div class="u"><i>${esc(host.slice(0, 1).toUpperCase())}</i>${esc(host)}</div><div class="h">${esc(titre)}</div><div class="d">${esc(desc.length > 158 ? desc.slice(0, 155) + '…' : desc)}</div></div><div class="qrw"><canvas width="232" height="232" aria-label="QR code du site"></canvas><span>Scanne-le avec un téléphone : il ouvre ton site. Imprime-le sur ta vitrine, tes cartes ou tes flyers.</span></div><div class="shb"><a class="wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent('Découvre notre site : ' + url)}">WhatsApp</a><button type="button" data-cp>Copier le lien</button><button type="button" data-dl>Télécharger le QR</button>${navigator.share ? '<button type="button" data-sh>Partager…</button>' : ''}</div>`, 'in');
    const cv = b.querySelector('canvas');
    try {
      await loadQR(); const q = qrcode(0, 'M'); q.addData(url); q.make();
      const n = q.getModuleCount(), m = 2, sz = cv.width / (n + m * 2), c = cv.getContext('2d');
      c.fillStyle = '#fff'; c.fillRect(0, 0, cv.width, cv.height); c.fillStyle = '#0b0d14';
      for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) c.fillRect(Math.floor((k + m) * sz), Math.floor((r + m) * sz), Math.ceil(sz), Math.ceil(sz));
    } catch (x) { cv.replaceWith(Object.assign(document.createElement('span'), { textContent: 'QR indisponible pour le moment.' })); }
    b.querySelector('[data-cp]').addEventListener('click', async e => { try { await navigator.clipboard.writeText(url); e.target.textContent = 'Lien copié ✓'; } catch (x) { e.target.textContent = url; } });
    b.querySelector('[data-dl]').addEventListener('click', () => { const big = document.createElement('canvas'); big.width = big.height = 1024; const g = big.getContext('2d'); g.imageSmoothingEnabled = false; g.drawImage(cv, 0, 0, 1024, 1024); const a = document.createElement('a'); a.download = 'qr-' + host + '.png'; a.href = big.toDataURL('image/png'); a.click(); });
    const sh = b.querySelector('[data-sh]'); if (sh) sh.addEventListener('click', () => navigator.share({ title: titre, url }).catch(() => {}));
    const q2 = document.createElement('div'); q2.className = 'qr';
    ['Rends ma description Google plus attirante', 'Optimise mon titre Google pour ma ville'].forEach(t => { const x = document.createElement('button'); x.type = 'button'; x.textContent = t; x.onclick = () => { q2.remove(); ask(t); }; q2.appendChild(x); });
    msgs.appendChild(q2); msgs.scrollTop = msgs.scrollHeight;
  }
  async function undo() {
    if (busy) return;
    if (!hist.length) return bubble('Rien à annuler.', 'in');
    busy = true;
    const prev = hist[hist.length - 1];
    const bad = await publish(prev);
    busy = false;
    if (bad) return bubble('Je n’ai pas pu revenir en arrière (' + esc(bad) + '). Réessaie dans un instant.', 'in');
    hist.pop(); cur = prev; bubble('<span class="ok">↶ C’est revenu comme avant, en ligne.</span>', 'in');
  }

  /* voix */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  function stopMic() { if (!rec) return; try { rec.abort(); } catch (x) {} rec = null; go.classList.remove('rec'); clearTimeout(micT); setBtn(); }
  let micT = null;
  function listen() {
    if (!SR) { txt.focus(); bubble('Touche le 🎤 de ton clavier pour dicter, puis envoie.', 'in'); return; }
    if (rec) { stopMic(); return; }
    rec = new SR(); rec.lang = 'fr-FR'; rec.interimResults = true; rec.continuous = false;
    const base = txt.value.trim() ? txt.value.trim() + ' ' : '';
    rec.onresult = e => {
      let t = ''; let fin = false;
      for (const r of e.results) { t += r[0].transcript; if (r.isFinal) fin = true; }
      txt.value = base + t; txt.dispatchEvent(new Event('input'));
      clearTimeout(micT); micT = setTimeout(stopMic, 2500);
      if (fin) stopMic();
    };
    /* la dictée remplit seulement le champ : rien ne part sans toucher « envoyer » */
    rec.onend = () => { rec = null; go.classList.remove('rec'); clearTimeout(micT); setBtn(); if (txt.value.trim()) txt.focus(); };
    rec.onerror = ev => { const r0 = rec; rec = null; go.classList.remove('rec'); clearTimeout(micT); setBtn(); if (ev && ev.error === 'aborted') return; bubble(ev && ev.error === 'not-allowed' ? 'Je n’ai pas accès au micro 🎤 Autorise-le dans ton navigateur, ou touche le micro de ton clavier pour dicter.' : 'Je n’ai rien entendu 🎤 Réessaie, ou écris ta demande.', 'in'); };
    go.classList.add('rec'); go.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>'; go.setAttribute('aria-label', 'Arrêter le micro');
    micT = setTimeout(stopMic, 12000);
    rec.start();
  }
  document.addEventListener('visibilitychange', () => { if (document.hidden) stopMic(); });
  window.addEventListener('pagehide', stopMic);
  $('comp').addEventListener('submit', e => { e.preventDefault(); if (rec) { stopMic(); return; } const v = txt.value.trim(); if (v) ask(v); else if (!login) listen(); });
  $('chips').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.photo != null) { $('pic').click(); return; } if (b.dataset.vers != null) { versions(); return; } if (b.dataset.share != null) { partager(); return; } if (b.dataset.stats != null) { visites(); return; } if (b.dataset.msgs != null) { messages(); return; } ask(b.textContent); });
  $('att').addEventListener('click', () => $('pic').click());

  /* photo : réduite, envoyée dans le stockage du site, puis proposée à l'assistant */
  function shrink(file, max) {
    return new Promise((ok, ko) => {
      const img = new Image(), u = URL.createObjectURL(file);
      img.onload = () => { const r = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r); const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); c.toBlob(b => b ? ok(b) : ko(new Error('image illisible')), 'image/jpeg', .86); };
      img.onerror = () => ko(new Error('format d’image non reconnu')); img.src = u;
    });
  }
  $('pic').addEventListener('change', async () => {
    const f = $('pic').files[0]; $('pic').value = ''; if (!f) return;
    if (!editor) return startLogin('Connecte-toi d’abord pour envoyer une photo 🔐');
    const local = URL.createObjectURL(f);
    bubble(`<img src="${local}" alt="">`, 'out'); sheet(true);
    const w = bubble('J’envoie ta photo…', 'in');
    try {
      const blob = await shrink(f, 1600);
      const name = `media/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
      const { error } = await sb.storage.from('flova').upload(name, blob, { contentType: 'image/jpeg', upsert: false });
      if (error) throw error;
      pending = sb.storage.from('flova').getPublicUrl(name).data.publicUrl;
      w.remove();
      bubble('Belle photo 📸 Où je la mets ?\nPar exemple : <b>« à la place de la photo Portrait »</b> ou <b>« en grand dans le mur de vidéos »</b>.', 'in');
      txt.focus();
    } catch (x) { w.remove(); bubble('La photo n’est pas passée. Réessaie, ou choisis une autre photo.', 'in'); }
  });

  /* démarrage */
  (async () => {
    const qd = new URLSearchParams(location.search);
    if (qd.get('domaine')) { const d = qd.get('domaine'), ok = qd.get('paye') === '1'; history.replaceState(null, '', '/studio'); window.__dom = { d, ok }; }
    let g = false; try { g = sessionStorage.getItem('flova-google') === '1'; sessionStorage.removeItem('flova-google'); } catch (x) {}
    if (/error_description=/.test(location.hash + location.search)) { history.replaceState(null, '', '/studio'); bubble('La connexion Google n’a pas abouti. Réessaie, ou utilise le code par e-mail.', 'in'); return startLogin(); }
    await new Promise(r => setTimeout(r, /access_token=|[?&]code=/.test(location.hash + location.search) ? 1200 : 0));
    if (/access_token=|[?&]code=/.test(location.hash + location.search)) history.replaceState(null, '', '/studio');
    const okEd = await checkEditor();
    if (okEd) { editor = true; post && ready && post({ type: 'apercu-session' }); if (!window.__dom) welcome(g); runAfter(); badgeMsgs(); }
    if (window.__dom) { const x = window.__dom; window.__dom = null; if (x.ok) followDomain(x.d); else bubble('Paiement annulé : rien n’a été prélevé. Touche à nouveau l’adresse quand tu veux.', 'in'); }
    if (!okEd) {
      const { data: s0 } = await sb.auth.getSession();
      if (s0.session) { const em = s0.session.user?.email || ''; await sb.auth.signOut(); bubble(`L’adresse <b>${esc(em)}</b> n’a pas l’accès à la modification de ce site. Connecte-toi avec une adresse autorisée.`, 'in'); }
      startLogin();
    }
  })();
})();
</script>
